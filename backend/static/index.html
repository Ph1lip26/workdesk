<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="workbench-token" content="__TOKEN__"><title>个人工作台 · 抖音收藏</title><link rel="stylesheet" href="/style.css"></head>
<body>
<!-- Official Lucide SVG geometry; upstream copyright/license retained in packaged static/icons/LICENSE. -->
<a class="skip-link" href="#library">跳到作品列表</a>
<nav class="module-rail" aria-label="工作台模块">
 <div class="workspace-mark" title="个人工作台" aria-label="个人工作台"><svg data-lucide="layout-dashboard" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect width="7" height="9" x="3" y="3" rx="1" /><rect width="7" height="5" x="14" y="3" rx="1" /><rect width="7" height="9" x="14" y="12" rx="1" /><rect width="7" height="5" x="3" y="16" rx="1" /></svg></div>
 <div id="modules"><button id="douyinmodule" class="rail-button active" aria-label="抖音收藏模块，当前模块" aria-current="page" title="抖音收藏" aria-controls="modulepanel"><svg data-lucide="square-play" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z" /></svg></button></div>
 <div class="rail-bottom"><button id="navtoggle" class="rail-button" aria-label="收起导航" title="收起导航" aria-controls="modulepanel" aria-expanded="true"><svg data-lucide="panel-left-close" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 3v18" /><path d="m16 15-3-3 3-3" /></svg></button><button id="toolsopen" class="rail-button" aria-label="更多选项" title="设置与工具"><svg data-lucide="settings" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg></button></div>
</nav>
<div id="panelhost"><aside id="modulepanel" class="module-panel" aria-label="抖音收藏导航">
 <header class="panel-heading"><p>个人工作台</p><h2>抖音收藏</h2><button id="closenav" class="icon-close" aria-label="关闭导航"><svg data-lucide="x" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></header>
 <nav class="panel-nav" aria-label="抖音功能">
  <p class="nav-caption">素材</p>
  <button class="panel-link" data-source="favorites" aria-current="page"><svg data-lucide="bookmark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z" /></svg><span>全部收藏</span><span id="favoritecount" class="nav-count"></span></button>
  <button class="panel-link" data-source="local"><svg data-lucide="monitor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" /></svg><span>本地素材</span><span id="localcount" class="nav-count"></span></button>
  <button id="queueopen" class="panel-link"><svg data-lucide="list-todo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M13 5h8" /><path d="M13 12h8" /><path d="M13 19h8" /><path d="m3 17 2 2 4-4" /><rect x="3" y="4" width="6" height="6" rx="1" /></svg><span>处理队列</span><span id="queuecount" class="nav-count" hidden>0</span></button>
  <div class="folder-section"><p class="nav-caption">收藏夹</p><div id="foldernav"></div><p id="folders-empty" class="nav-empty" hidden>暂无收藏夹</p></div>
 </nav>
 <div class="panel-footer"><span class="local-dot" aria-hidden="true"></span>本机工作台</div>
</aside></div>
<div class="workspace">
<header class="topbar"><div><p id="viewcontext" class="view-context">抖音收藏</p><h1 id="viewtitle">全部收藏</h1></div><div class="top-actions"><button id="sync" class="refresh-button"><svg data-lucide="refresh-cw" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg><span>刷新收藏</span></button></div></header>
<main id="library">
<div class="controls"><label class="search-box"><svg data-lucide="search" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg><input id="search" type="search" aria-label="搜索作品或作者" placeholder="搜索作品或作者"></label><select id="source" aria-label="作品来源" hidden><option value="favorites">全部收藏</option><option value="local">本地素材</option></select><label class="sr-only" for="status">入库状态</label><select id="status"><option value="all">所有状态</option><option value="new">未入库</option><option value="done">已入库</option></select></div>
<div class="list-meta"><p id="scope" tabindex="-1" aria-live="polite">正在读取收藏…</p><label class="select-all"><input id="selectall" type="checkbox"><span>选择本页</span></label></div>
<div id="notice" class="notice" role="status" hidden><span id="connection"></span><button id="notice-detail" class="quiet">详情</button></div>
<div id="cards" class="cards" aria-label="收藏作品"></div>
<nav id="pagination" class="pagination" aria-label="作品翻页" hidden><button id="prevpage" aria-label="上一页">上一页</button><div id="pagenumbers" class="page-numbers"></div><span id="pageinfo" role="status" aria-live="polite"></span><button id="nextpage" aria-label="下一页">下一页</button></nav>
</main>
</div>
<div id="selectionbar" class="selectionbar" hidden><span id="selected">已选 0 条</span><button id="clear" class="quiet">取消选择</button><button id="enqueue" class="primary"><span>加入知识库</span><svg data-lucide="arrow-right" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></button></div>
<dialog id="tools" class="sheet"><div class="dialog-head"><h2>更多</h2><button id="closetools" class="icon-close" aria-label="关闭更多"><svg data-lucide="x" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></div><div class="tool-section"><h3>抖音账号</h3><p id="account-status" class="muted">刷新和检查登录在后台进行。</p><div class="tool-buttons"><button id="login">检查登录</button><button id="openlogin" hidden>打开扫码窗口</button></div></div><div class="tool-section"><h3>列表</h3><label class="tool-row" for="sort">排序 <select id="sort"><option value="collection">最近收藏</option><option value="published">最近发布</option></select></label><button id="refresh" class="quiet">重新检查入库状态</button><p class="muted">原始资料或知识笔记已保存，均算已入库。已有原始资料的可继续生成知识笔记。</p></div><div class="tool-section"><h3>补充链接</h3><label class="sr-only" for="links">作品链接或ID</label><textarea id="links" placeholder="完整链接或作品 ID，每行一条"></textarea><button id="import">加入待选列表</button></div><details class="diagnostics"><summary>连接详情</summary><p id="diagnostictext" class="muted"></p></details></dialog>
<dialog id="queuepanel" class="drawer"><div class="dialog-head"><h2>处理队列</h2><button id="closequeue" class="icon-close" aria-label="关闭队列"><svg data-lucide="x" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></div><div class="queue-control"><span class="muted">逐条处理</span><button id="pause" class="quiet">暂停后续</button></div><div id="jobs"></div></dialog>
<dialog id="preview" class="sheet preview-sheet"><div class="dialog-head"><h2>笔记草稿</h2><button id="closepreview" class="icon-close" aria-label="关闭草稿"><svg data-lucide="x" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></div><pre id="previewtext"></pre></dialog><div id="toast" role="status"></div><script src="/app.js"></script>
</body></html>
